<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Table Management</title>
</head>
<body>
  <h1>Restaurant Table Management</h1>
  <p>Use this page to add tables and update their status.</p>

  <h2>Add a table</h2>
  <form id="addTableForm">
    <label for="tableNumber">Table number:</label>
    <input id="tableNumber" type="number" min="1" required>

    <label for="tableCapacity">Capacity:</label>
    <input id="tableCapacity" type="number" min="1" required>

    <button type="submit">Add table</button>
  </form>

  <h2>Table actions</h2>
  <p>
    <label for="tableSelect">Choose a table:</label>
    <select id="tableSelect"></select>
  </p>
  <p>
    <label for="customerCount">Number of customers:</label>
    <input id="customerCount" type="number" min="1">
    <button id="assignBtn" type="button">Assign customers</button>
  </p>
  <p>
    <button id="leaveBtn" type="button">Customers leave</button>
    <button id="cleanBtn" type="button">Finish cleaning</button>
    <button id="updateBtn" type="button">Update capacity</button>
  </p>

  <h2>Statistics</h2>
  <p>Total tables: <span id="totalTables">0</span></p>
  <p>Available tables: <span id="availableTables">0</span></p>
  <p>Occupied tables: <span id="occupiedTables">0</span></p>
  <p>Customers seated: <span id="customerCountTotal">0</span></p>

  <h2>Tables</h2>
  <table border="1">
    <thead>
      <tr>
        <th>Table number</th>
        <th>Capacity</th>
        <th>Status</th>
        <th>Customers</th>
      </tr>
    </thead>
    <tbody id="tableList"></tbody>
  </table>

  <script>
    const tableList = document.getElementById('tableList');
    const tableSelect = document.getElementById('tableSelect');
    const tableNumberInput = document.getElementById('tableNumber');
    const capacityInput = document.getElementById('tableCapacity');
    const customerCountInput = document.getElementById('customerCount');
    let tables = [];

    function getSelectedTable() {
      const selectedNumber = Number(tableSelect.value);
      return tables.find((table) => table.tableNumber === selectedNumber);
    }

    async function request(path, values = {}, method = 'POST') {
      const options = { method };
      if (options.method === 'POST') {
        options.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
        options.body = new URLSearchParams(values);
      }

      const response = await fetch(path, options);
      const result = await response.json();
      if (!response.ok) {
        throw new Error(result.error || 'The request could not be completed.');
      }
      tables = result;
      renderTables();
    }

    function showError(error) {
      alert(error.message);
    }

    function updateStatistics() {
      document.getElementById('totalTables').textContent = tables.length;
      document.getElementById('availableTables').textContent =
        tables.filter((table) => table.status === 'AVAILABLE').length;
      document.getElementById('occupiedTables').textContent =
        tables.filter((table) => table.status === 'OCCUPIED').length;
      document.getElementById('customerCountTotal').textContent =
        tables.reduce((total, table) => total + table.customerCount, 0);
    }

    function renderTables() {
      tableList.innerHTML = '';
      tableSelect.innerHTML = '';

      const sortedTables = tables.slice().sort((a, b) => a.tableNumber - b.tableNumber);

      if (sortedTables.length === 0) {
        const row = tableList.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 4;
        cell.textContent = 'No tables have been added.';

        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'No tables available';
        tableSelect.appendChild(option);
      } else {
        sortedTables.forEach((table) => {
          const row = tableList.insertRow();
          row.insertCell().textContent = table.tableNumber;
          row.insertCell().textContent = table.capacity;
          row.insertCell().textContent = table.status;
          row.insertCell().textContent = table.customerCount;

          const option = document.createElement('option');
          option.value = table.tableNumber;
          option.textContent = `Table ${table.tableNumber}`;
          tableSelect.appendChild(option);
        });
      }

      updateStatistics();
    }

    document.getElementById('addTableForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const tableNumber = Number(tableNumberInput.value);
      const capacity = Number(capacityInput.value);
      try {
        await request('/api/tables', { tableNumber, capacity });
        event.target.reset();
      } catch (error) {
        showError(error);
      }
    });

    document.getElementById('assignBtn').addEventListener('click', async () => {
      const table = getSelectedTable();
      const customerCount = Number(customerCountInput.value);

      if (!table) {
        alert('Please add and select a table first.');
      } else {
        try {
          await request(`/api/tables/${table.tableNumber}/assign`, { customerCount });
          customerCountInput.value = '';
        } catch (error) {
          showError(error);
        }
      }
    });

    document.getElementById('leaveBtn').addEventListener('click', async () => {
      const table = getSelectedTable();

      if (!table) {
        alert('Please add and select a table first.');
      } else {
        try {
          await request(`/api/tables/${table.tableNumber}/leave`);
        } catch (error) {
          showError(error);
        }
      }
    });

    document.getElementById('cleanBtn').addEventListener('click', async () => {
      const table = getSelectedTable();

      if (!table) {
        alert('Please add and select a table first.');
      } else {
        try {
          await request(`/api/tables/${table.tableNumber}/clean`);
        } catch (error) {
          showError(error);
        }
      }
    });

    document.getElementById('updateBtn').addEventListener('click', async () => {
      const table = getSelectedTable();

      if (!table) {
        alert('Please add and select a table first.');
        return;
      }

      const newCapacity = Number(prompt('Enter the new capacity:'));
      if (!newCapacity || newCapacity < 1) {
        alert('Enter a valid capacity.');
        return;
      }

      try {
        await request(`/api/tables/${table.tableNumber}/capacity`, { capacity: newCapacity });
      } catch (error) {
        showError(error);
      }
    });

    request('/api/tables', {}, 'GET').catch(showError);
  </script>
</body>
</html>
